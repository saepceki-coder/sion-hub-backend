<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Sion Hub Tool v27</title>
<style>
:root{--bg:#0a0a0a;--bg2:#121212;--surf:#181818;--surf2:#222;--bor:#2a2a2a;--txt:#f5f5f5;--soft:#a3a3a3;--mut:#6b6b6b;--grn:#4ade80;--red:#f87171;--amb:#fbbf24;--pri:#6366f1;--pri2:#8b5cf6}
body.light{--bg:#fafafa;--bg2:#f0f0f0;--surf:#fff;--surf2:#f5f5f5;--bor:#e5e5e5;--txt:#171717;--soft:#525252;--mut:#a3a3a3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
svg{stroke-width:1.8}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:10px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--bor);flex-shrink:0}
.hdr h1{font-size:15px;font-weight:800;letter-spacing:-.02em}
.hdr .sub{font-size:9px;color:var(--mut);letter-spacing:.15em;text-transform:uppercase;margin-top:1px}
.hdr-r{display:flex;gap:6px}
.hbtn{width:36px;height:36px;border-radius:10px;background:var(--surf);border:1px solid var(--bor);display:flex;align-items:center;justify-content:center;color:var(--soft)}
.hbtn svg{width:18px;height:18px}
.hbtn:active{transform:scale(.94)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.tab{display:none}.tab.on{display:block}
.hero{position:relative;height:200px;background:#000;overflow:hidden;margin-bottom:8px}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.hero video.on{opacity:1}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.5) 50%,var(--bg) 100%)}
.hero .ct{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;z-index:2}
.hero .vb{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;width:fit-content;margin-bottom:10px}
.hero .vb .d{width:5px;height:5px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn)}
.hero h2{font-size:22px;font-weight:800;line-height:1.05;letter-spacing:-.03em;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.hero p{font-size:11px;opacity:.75;margin-top:5px}
.hero .sw{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;z-index:5}
.hero .sw:active{transform:scale(.9) rotate(20deg)}
.hero .sw svg{width:20px;height:20px}
.sec{padding:0 16px;margin-bottom:20px}
.st{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.st .dot{width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surf);border:1px solid var(--bor);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.15s}
.card:active{transform:scale(.97);border-color:var(--pri)}
.card .ic{width:40px;height:40px;border-radius:11px;background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--pri2)}
.card .ic svg{width:20px;height:20px}
.card .t{font-size:12.5px;font-weight:700}
.card .d{font-size:10.5px;color:var(--mut);line-height:1.3}
.nav{display:flex;background:var(--bg2);border-top:1px solid var(--bor);flex-shrink:0;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;color:var(--mut);font-size:10px;font-weight:600;position:relative}
.nav button svg{width:20px;height:20px}
.nav button.on{color:var(--pri2)}
.nav button.on::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:18px;height:2px;background:var(--pri);border-radius:2px}
.panel{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column}
.panel.on{display:flex}
.phdr{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--bor);flex-shrink:0}
.phdr .b{width:38px;height:38px;border-radius:11px;background:var(--surf);border:1px solid var(--bor);display:flex;align-items:center;justify-content:center;color:var(--soft)}
.phdr .b svg{width:18px;height:18px}
.phdr .ti{flex:1;min-width:0}
.phdr .ti h3{font-size:15px;font-weight:700}
.phdr .ti p{font-size:11px;color:var(--mut);margin-top:1px}
.pbody{flex:1;overflow-y:auto;padding:20px 16px 40px;-webkit-overflow-scrolling:touch}
.pinner{max-width:560px;margin:0 auto}
.f{margin-bottom:14px}
.f label{display:block;font-size:10.5px;font-weight:700;color:var(--soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.f input,.f textarea,.f select{width:100%;background:var(--surf);border:1px solid var(--bor);border-radius:11px;padding:13px 15px;font-size:14px;outline:none;color:var(--txt);resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--pri)}
.f textarea{min-height:80px}
.iw{position:relative}
.iw input{padding-right:80px!important}
.iw .pst{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px 12px;border-radius:8px;background:var(--surf2);border:1px solid var(--bor);font-size:11px;font-weight:700;color:var(--soft)}
.btn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 20px rgba(99,102,241,.35)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.sec{background:var(--surf);color:var(--txt);box-shadow:none;border:1px solid var(--bor)}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;margin-top:8px}
.row .btn{margin-top:0}
.tabs{display:flex;gap:4px;background:var(--surf);border:1px solid var(--bor);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button svg{width:15px;height:15px}
.tabs button.on{background:var(--bg2);color:var(--txt)}
.res{background:var(--surf);border:1px solid var(--bor);border-radius:12px;padding:14px;margin-top:14px;display:none;word-break:break-word}
.res.on{display:block}
.res.ok{border-color:var(--grn)}
.res.err{border-color:var(--red);color:var(--red)}
.info{padding:12px 14px;border-radius:11px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);font-size:11.5px;color:var(--soft);line-height:1.5;margin-bottom:14px;display:flex;gap:9px}
.info svg{width:16px;height:16px;flex-shrink:0;color:var(--pri2);margin-top:1px}
.spin{display:none;flex-direction:column;align-items:center;padding:24px 20px;gap:10px}
.spin.on{display:flex}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--surf2);border-top-color:var(--pri);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spin-txt{font-size:12px;color:var(--mut)}
.dl-opt{padding:12px 14px;background:var(--surf2);border:1px solid var(--bor);border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--txt);font-weight:600;font-size:12.5px;width:100%;text-align:left;cursor:pointer;margin-bottom:6px}
.dl-opt:active{transform:scale(.98);border-color:var(--pri)}
.dl-opt.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:var(--pri);color:#fff}
.dl-opt .b{font-size:9.5px;padding:3px 8px;border-radius:100px;background:rgba(74,222,128,.15);color:var(--grn);border:1px solid rgba(74,222,128,.3);font-weight:800}
.dl-opt.primary .b{background:#fff;color:var(--pri)}
.dl-opt .info2{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.dl-opt .info2 .q{font-size:12.5px;font-weight:700}
.dl-opt .info2 .sz{font-size:10px;color:var(--mut);opacity:.8}
.dl-opt.primary .info2 .sz{color:rgba(255,255,255,.75)}
#toasts{position:fixed;top:16px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 24px)}
.toast{background:var(--surf2);border:1px solid var(--bor);padding:12px 14px;border-radius:12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;animation:tIn .3s}
.toast svg{width:16px;height:16px;flex-shrink:0}
.toast.ok{border-left:3px solid var(--grn)}.toast.ok svg{color:var(--grn)}
.toast.err{border-left:3px solid var(--red)}.toast.err svg{color:var(--red)}
.toast.warn{border-left:3px solid var(--amb)}.toast.warn svg{color:var(--amb)}
@keyframes tIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.mbox{background:var(--surf);border:1px solid var(--bor);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:85vh;display:flex;flex-direction:column}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--bor)}
.mhdr h3{font-size:15px;font-weight:800}
.mhdr button{width:34px;height:34px;border-radius:10px;background:var(--surf2);border:1px solid var(--bor);display:flex;align-items:center;justify-content:center}
.mhdr button svg{width:16px;height:16px}
.mbody{padding:8px 22px 26px;overflow-y:auto}
.si{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--bor)}
.si:last-child{border-bottom:none}
.si .lb{font-size:13.5px;font-weight:600}
.sw{width:44px;height:26px;border-radius:100px;background:var(--bor);position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.sw.on{background:var(--pri)}
.sw.on::after{left:21px}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_WORKER = 'https://wild-haze-bbfc.saepceki.workers.dev';
const S = { theme:'dark', haptic:true, worker:DEFAULT_WORKER };
let toastN = 0;
let curVid = 'gojo';
let timerI = null, timerMs = 0, timerRun = false;
let ttsV = [];

function getWorker() { return S.worker || DEFAULT_WORKER; }
function saveWorker(url) {
  url = (url || '').trim();
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  url = url.replace(/\/+$/, '');
  S.worker = url || DEFAULT_WORKER;
  try { localStorage.setItem('s27_worker', S.worker); } catch(e){}
  toast('Worker disimpan', 'ok');
}
function wFetch(target, opts) {
  const w = getWorker();
  return fetch(w + '/?apiurl=' + encodeURIComponent(target), opts);
}

function toast(msg, type='info', dur=2500) {
  const w = $('toasts'); if (!w) return;
  if (toastN >= 3) { const o = w.firstChild; if (o) o.remove(); } else toastN++;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = type==='ok'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':type==='err'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  el.innerHTML = ic + '<span>' + msg + '</span>';
  w.appendChild(el);
  setTimeout(()=>{ el.style.animation='tIn .3s reverse forwards'; setTimeout(()=>{ el.remove(); toastN=Math.max(0,toastN-1); },300); }, dur);
}
function haptic() { if (S.haptic && navigator.vibrate) navigator.vibrate(10); }
function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function saveS() { try { localStorage.setItem('s27', JSON.stringify(S)); } catch(e){} }
function loadS() {
  try { Object.assign(S, JSON.parse(localStorage.getItem('s27') || '{}')); } catch(e){}
  S.worker = localStorage.getItem('s27_worker') || DEFAULT_WORKER;
  setTheme(S.theme);

    const a = $('swHap'); if (a) a.classList.toggle('on', S.haptic);
    const t = $('selTheme'); if (t) t.value = S.theme;
    const w = $('workerUrl'); if (w) w.value = S.worker;

    el.value = t.trim(); toast('Ditempel','ok',1200);

function hideSpin(id) { const e = $(id); if (e) setTimeout(()=>e.classList.remove('on'), 300); }

async function downloadViaWorker(targetUrl, filename, btn) {
  if (btn) btn.disabled = true;
  const w = getWorker();
  const proxied = w + '/?apiurl=' + encodeURIComponent(targetUrl);

  toast('Mengunduh...', 'info', 2000);
  try {
    const r = await fetch(proxied, { signal: AbortSignal.timeout(180000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    if (blob.size < 5000) throw new Error('File terlalu kecil');
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 120000);
    toast('Tersimpan: ' + filename.slice(0, 40), 'ok', 3000);
  } catch(err) {
    toast('Buka tab baru: ' + err.message, 'warn', 2500);
    window.open(proxied, '_blank', 'noopener');
  }
  if (btn) btn.disabled = false;
}

const PIPED = ['https://pipedapi.kavin.rocks','https://api.piped.yt','https://pipedapi.adminforge.de','https://pipedapi.drgns.space','https://pipedapi.qdi.fi'];
const INVIDIOUS = ['https://inv.nadeko.net','https://invidious.nerdvpn.de','https://invidious.f5.si'];
let ytData = null, ytVideoList = [], ytAudioList = [];

function extractYtId(url) {
  try {
    const u = new URL(url);
    if (/youtu\.be/i.test(u.hostname)) return u.pathname.split('/').filter(Boolean)[0];
    const v = u.searchParams.get('v'); if (v) return v;
    const p = u.pathname.split('/').filter(Boolean);
    const i = p.findIndex(x => ['shorts','embed','live'].includes(x));
    if (i >= 0 && p[i+1]) return p[i+1];
  } catch(_){}
  return null;
}

async function dlYt(btn) {
  const url = $('ytUrl').value.trim();
  if (!url) return toast('Paste link','warn');
  const id = extractYtId(url);
  if (!id) return toast('Link invalid','err');

  showRes('ytRes','');
  showSpin('ytSpin', 'Mengambil data video...');

  let data = null;
  for (const server of PIPED) {
    try {
      const r = await wFetch(server + '/streams/' + id, { signal: AbortSignal.timeout(15000) });
      if (!r.ok) continue;
      const d = await r.json();
      if (!d || !d.title) continue;
      data = d; break;
    } catch(e) {}
  }
  if (!data) {
    for (const server of INVIDIOUS) {
      try {
        const r = await wFetch(server + '/api/v1/videos/' + id, { signal: AbortSignal.timeout(15000) });
        if (!r.ok) continue;
        const d = await r.json();
        if (!d || !d.title) continue;
        data = { title: d.title, videoStreams: d.formatStreams || [], audioStreams: (d.adaptiveFormats||[]).filter(f => /audio/i.test(f.type||'')) };
        break;
      } catch(e) {}
    }
  }

  hideSpin('ytSpin');

  if (!data) {
    showRes('ytRes', `<div class="info"><svg><use href="#i-info"/></svg><span>Server sibuk. Buka web downloader:</span></div>
      <a class="dl-opt" href="https://y2mate.com/youtube/${id}" target="_blank" rel="noopener"><div class="info2"><div class="q">Y2mate</div></div><span class="b">WEB</span></a>

    btn.disabled = false; return;
  }

  ytData = data;
  ytVideoList = (data.videoStreams || []).filter(v => v.url && !v.videoOnly);
  ytAudioList = (data.audioStreams || []).filter(a => a.url);

  let html = `<div style="font-weight:700;margin-bottom:12px;font-size:13px">${esc(data.title.slice(0,150))}</div>`;
  if (data.uploader || data.author) html += `<div style="font-size:11px;color:var(--mut);margin-bottom:12px">${esc(data.uploader || data.author)}</div>`;

  if (ytAudioList.length) {
    html += `<div style="font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:8px">Audio</div>
      <button class="dl-opt primary" onclick="ytDlAudio(this)"><div class="info2"><div class="q">Download Audio (M4A)</div><div class="sz">Best quality</div></div><span class="b">AUDIO</span></button>`;
  }

  if (ytVideoList.length) {
    html += `<div style="font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:14px 0 8px">Video MP4</div>`;
    ytVideoList.slice(0,6).forEach((v, i) => {
      const q = v.quality || (v.height ? v.height + 'p' : 'Video');
      html += `<button class="dl-opt" onclick="ytDlVideo(${i},this)"><div class="info2"><div class="q">${esc(q)}</div><div class="sz">Video MP4</div></div><span class="b">MP4</span></button>`;
    });

  showRes('ytRes', html, 'ok');
  btn.disabled = false;
}

function ytDlAudio(btn) {
  if (!ytData || !ytAudioList.length) return toast('Data belum siap','warn');
  ytAudioList.sort((a,b) => (b.bitrate||0) - (a.bitrate||0));
  const audio = ytAudioList[0];

}
function ytDlVideo(idx, btn) {
  const v = ytVideoList[idx];
  if (!v) return toast('Video tidak tersedia','err');
  const q = (v.quality || 'video').replace(/[^\w]/g, '');
  downloadViaWorker(v.url, sanitizeFn(ytData.title) + '_' + q + '.mp4', btn);
}

/* ============ IMAGE COMPRESS ============ */
async function imgcRun(e) {
  const f = e.target.files[0]; if (!f) return;
  const box = $('imgcResult');
  box.innerHTML = '<div style="text-align:center;padding:20px;color:var(--mut);font-size:12px">Memproses...</div>';
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = async () => {
      const c = document.createElement('canvas');
      let {width, height} = img; const max = 1920;
      if (width > max || height > max) { const rr = Math.min(max/width, max/height); width = Math.round(width*rr); height = Math.round(height*rr); }
      c.width = width; c.height = height;
      const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, width, height);
      await new Promise(rr => setTimeout(rr, 300));
      const b70 = await new Promise(rr => c.toBlob(rr, 'image/jpeg', 0.7));
      const b85 = await new Promise(rr => c.toBlob(rr, 'image/jpeg', 0.85));
      const oS = f.size;
      const title = sanitizeFn(f.name.replace(/\.[^.]+$/,''));
      const card = (blob, q) => {
        const p = ((1-blob.size/oS)*100).toFixed(1);
        const u = URL.createObjectURL(blob);
        return `<a class="dl-opt" href="${u}" download="${esc(title)}_${q}.jpg"><div class="info2"><div class="q">Kualitas ${q}% · ${Math.round(blob.size/1024)} KB</div><div class="sz">Hemat ${p}%</div></div><span class="b">JPG</span></a>`;
      };
      box.innerHTML = `<div style="padding:14px;background:var(--surf);border:1px solid var(--grn);border-radius:12px"><div style="font-weight:700;margin-bottom:6px;color:var(--grn)">✓ Selesai</div><div style="font-size:11px;color:var(--mut);margin-bottom:12px">${width}×${height} · ${Math.round(oS/1024)} KB</div>${card(b70,70)}${card(b85,85)}</div>`;
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
}

  const t = $('pwType').value; let c = '';
  if (t==='all') c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?';
  else if (t==='alnum') c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  else if (t==='alpha') c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  else c = '0123456789';
  let pw = '';
  for (let i = 0; i < len; i++) pw += c[Math.floor(Math.random() * c.length)];
  const el = $('pwRes'); if (el) { el.textContent = pw; el.classList.add('on'); }
}
function genQR() {
  const t = $('qrText').value.trim(); if (!t) return toast('Kosong','warn');
  const u = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=' + encodeURIComponent(t);
  showRes('qrRes', `<img src="${esc(u)}" style="width:100%;max-width:260px;display:block;margin:0 auto;background:#fff;padding:12px;border-radius:12px">`, 'ok');
}
function b64E() { try { const s = $('b64In').value; const b = new TextEncoder().encode(s); let x = ''; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i+0x8000)); const e = $('b64Res'); e.textContent = btoa(x); e.classList.add('on'); } catch(e) { toast('Error','err'); } }
function b64D() { try { const c = $('b64In').value.replace(/\s/g,''); const x = atob(c); const arr = Uint8Array.from(x, ch => ch.charCodeAt(0)); const e = $('b64Res'); e.textContent = new TextDecoder().decode(arr); e.classList.add('on'); } catch(e) { toast('Invalid','err'); } }
function colorUp() {
  const h = $('cpIn').value;
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  const e = $('cpRes');
  if (e) { e.innerHTML = `<div style="display:flex;align-items:center;gap:14px;padding:14px;background:var(--surf);border:1px solid var(--bor);border-radius:12px"><div style="width:60px;height:60px;border-radius:12px;background:${esc(h)};flex-shrink:0"></div><div style="font-family:ui-monospace,monospace"><div style="font-size:15px;font-weight:700;color:var(--pri2)">${esc(h.toUpperCase())}</div><div style="font-size:12px;color:var(--soft);margin-top:3px">rgb(${r},${g},${b})</div></div></div>`; e.classList.add('on'); }
}
async function genHash() {
  const t = $('hashIn').value; if (!t) return toast('Empty','warn');
  try {
    const d = new TextEncoder().encode(t);
    const [s256, s1] = await Promise.all([crypto.subtle.digest('SHA-256', d), crypto.subtle.digest('SHA-1', d)]);
    const hex = b => Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
    showRes('hashRes', `<div style="background:var(--surf);border:1px solid var(--bor);border-radius:12px;padding:14px"><div style="font-size:10px;color:var(--mut);margin-bottom:3px">SHA-256</div><div style="font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pri2);word-break:break-all;margin-bottom:10px">${hex(s256)}</div><div style="font-size:10px;color:var(--mut);margin-bottom:3px">SHA-1</div><div style="font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pri2);word-break:break-all">${hex(s1)}</div></div>`, 'ok');
  } catch(e) { toast('Error','err'); }
}
async function checkIP(btn) {
  btn.disabled = true;
  try {
    const r = await fetch('https://ipapi.co/json/', {signal: AbortSignal.timeout(10000)});
    const d = await r.json();
    let h = '';
    [['IP',d.ip],['Negara',d.country_name],['Kota',d.city],['ISP',d.org]].forEach(([k,v]) => {
      if (v) h += `<div style="display:flex;justify-content:space-between;padding:10px;background:var(--surf);border:1px solid var(--bor);border-radius:9px;font-size:12px;margin-bottom:6px"><span style="color:var(--mut)">${k}</span><span style="font-weight:600;color:var(--txt)">${esc(String(v))}</span></div>`;
    });
    showRes('ipRes', h, 'ok');
  } catch(e) { showRes('ipRes', 'Gagal: ' + esc(e.message), 'err'); }
  finally { btn.disabled = false; }
}
function doCalc() {
  const e = $('calcIn').value.trim(); if (!e) return;
  if (!/^[\d\s+\-*/().,%]+$/.test(e)) return toast('Karakter invalid','err');
  try {
    const r = Function('"use strict";return (' + e.replace(/%/g,'/100') + ')')();
    showRes('calcRes', esc(String(r)), 'ok');
  } catch(e) { toast('Error','err'); }
}
function timerToggle() {
  const b = $('timerBtn');
  if (timerRun) { clearInterval(timerI); timerRun = false; if (b) b.textContent = '▶ Lanjut'; }
  else { timerRun = true; if (b) b.textContent = '⏸ Pause'; let last = Date.now(); timerI = setInterval(() => { const n = Date.now(); timerMs += n-last; last = n; updTimer(); }, 30); }
}
function timerReset() { clearInterval(timerI); timerRun = false; timerMs = 0; const b = $('timerBtn'); if (b) b.textContent = '▶ Mulai'; updTimer(); }
function updTimer() { const ms = timerMs; const m = Math.floor(ms/60000).toString().padStart(2,'0'); const s = Math.floor((ms%60000)/1000).toString().padStart(2,'0'); const c = Math.floor((ms%1000)/10).toString().padStart(2,'0'); const el = $('timerDisplay'); if (el) el.textContent = `${m}:${s}.${c}`; }
function loadNotesFn() { const el = $('notesArea'); if (el) el.value = localStorage.getItem('s27_notes') || ''; }
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'notesArea') {
    try { localStorage.setItem('s27_notes', e.target.value); } catch(_){}
    const el = $('notesSaved'); if (el) el.textContent = 'Tersimpan ' + new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  }
});
function clearNotes() { if (!confirm('Hapus?')) return; const el = $('notesArea'); if (el) el.value = ''; try { localStorage.removeItem('s27_notes'); } catch(_){} toast('Dihapus','ok'); }
function initTTSFn() { if (!('speechSynthesis' in window)) return; const l = () => { ttsV = speechSynthesis.getVoices().filter(v=>v&&v.lang); }; l(); speechSynthesis.addEventListener('voiceschanged', l); }
function speakT() { const t = $('ttsIn').value.trim(); if (!t) return; if (!('speechSynthesis' in window)) return toast('Not supported','err'); const s = speechSynthesis; try { s.cancel(); s.resume(); } catch(_){} const u = new SpeechSynthesisUtterance(t); u.lang = $('ttsLang').value; try { s.speak(u); } catch(e) {} }
function stopT() { if ('speechSynthesis' in window) try { speechSynthesis.cancel(); } catch(_){} }

function cardHTML(t) { return `<button class="card" data-tool="${t.id}" onclick="openTool('${t.id}')"><div class="ic"><svg><use href="#${t.ic}"/></svg></div><div class="t">${t.t}</div><div class="d">${t.d}</div></button>`; }
function renderTools() {
  const qg = $('quickTools'); if (qg) qg.innerHTML = TOOLS.filter(t => t.cat === 'dl').map(cardHTML).join('');
  const pg = $('popularTools'); if (pg) pg.innerHTML = TOOLS.filter(t => ['pw','qr','b64','calc','notes','imgc'].includes(t.id)).map(cardHTML).join('');
  const ag = $('allGrid'); if (ag) ag.innerHTML = TOOLS.map(cardHTML).join('');
}

function openTool(id) {
  haptic();
  const t = TOOLS.find(x => x.id === id);
  if (!t) return;
  $('pTitle').textContent = t.t;
  $('pSub').textContent = t.d;
  $('pBody').innerHTML = renderToolHTML(id);
  $('panel').classList.add('on');
  if (initToolFn[id]) setTimeout(() => { try { initToolFn[id](); } catch(e) { console.error(e); } }, 50);
}
